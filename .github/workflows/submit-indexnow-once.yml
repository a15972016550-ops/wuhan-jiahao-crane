name: One-time IndexNow notification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/submit-indexnow-once.yml

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public key file and notify IndexNow
        shell: bash
        run: |
          set -euo pipefail
          key='6fc78e52c02958b2a79f85c10697ee37'
          host='a15972016550-ops.github.io'
          key_url='https://a15972016550-ops.github.io/wuhan-jiahao-crane/6fc78e52c02958b2a79f85c10697ee37.txt'
          curl --fail --silent --show-error "$key_url" -o /tmp/indexnow-key.txt
          actual="$(tr -d '\r\n' < /tmp/indexnow-key.txt)"
          if [ "$actual" != "$key" ]; then
            echo 'Public key file is missing or does not match; no notification was sent.'
            exit 1
          fi
          cat > /tmp/indexnow-payload.json <<'JSON'
          {
            "host": "a15972016550-ops.github.io",
            "key": "6fc78e52c02958b2a79f85c10697ee37",
            "keyLocation": "https://a15972016550-ops.github.io/wuhan-jiahao-crane/6fc78e52c02958b2a79f85c10697ee37.txt",
            "urlList": [
              "https://a15972016550-ops.github.io/wuhan-jiahao-crane/",
              "https://a15972016550-ops.github.io/wuhan-jiahao-crane/guide.html",
              "https://a15972016550-ops.github.io/wuhan-jiahao-crane/faq.html",
              "https://a15972016550-ops.github.io/wuhan-jiahao-crane/xunjia.html",
              "https://a15972016550-ops.github.io/wuhan-jiahao-crane/dunwei.html",
              "https://a15972016550-ops.github.io/wuhan-jiahao-crane/fuwu-area.html"
            ]
          }
          JSON
          status="$(curl --silent --show-error --output /tmp/indexnow-response.txt --write-out '%{http_code}' \
            --request POST 'https://api.indexnow.org/indexnow' \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow-payload.json)"
          echo "IndexNow HTTP status: $status"
          cat /tmp/indexnow-response.txt
          case "$status" in
            200|202) echo 'IndexNow received the URL notification; this does not prove indexing.' ;;
            *) exit 1 ;;
          esac

name: Notify IndexNow for changed pages

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "**/*.html"
      - ".github/workflows/indexnow.yml"

permissions:
  contents: read

jobs:
  notify:
    if: ${{ !contains(github.event.head_commit.message, '[skip indexnow]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify the published version and notify IndexNow
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          import time
          import xml.etree.ElementTree as ET
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote, unquote, urlsplit
          from urllib.request import Request, urlopen

          BASE = "https://whdiaozhuang.cn/"
          HOST = "whdiaozhuang.cn"

          def url_for(path):
              return BASE if path == "index.html" else BASE + quote(path, safe="/")

          def changed_paths():
              before = os.environ.get("BEFORE_SHA", "")
              current = os.environ.get("CURRENT_SHA", "")
              if not before or set(before) == {"0"}:
                  raise ValueError("Previous commit is unavailable; no URLs submitted")
              lines = subprocess.check_output(
                  ["git", "diff", "--no-renames", "--name-only", "--diff-filter=ACMRD", before, current],
                  text=True,
              ).splitlines()
              return {p for p in lines if p.endswith(".html")}

          def published(path):
              expected = Path(path)
              request = Request(url_for(path), headers={"Accept-Encoding": "identity", "Cache-Control": "no-cache"})
              try:
                  with urlopen(request, timeout=8) as response:
                      content = response.read()
                      if not expected.is_file():
                          return False
                      return hashlib.sha256(content).digest() == hashlib.sha256(expected.read_bytes()).digest()
              except HTTPError as error:
                  return not expected.is_file() and error.code in (404, 410)
              except (URLError, OSError, TimeoutError):
                  return False

          def main():
              paths = changed_paths()
              if not paths:
                  print("No changed public HTML URLs; nothing to submit.")
                  return

              deadline = time.monotonic() + 120
              pending = set(paths)
              while pending:
                  checked = sorted(pending)
                  with ThreadPoolExecutor(max_workers=6) as pool:
                      results = list(pool.map(published, checked))
                  pending = {p for p, ready in zip(checked, results) if not ready}
                  if not pending or time.monotonic() >= deadline:
                      break
                  print("Waiting for the live site to match:", ", ".join(sorted(pending)))
                  time.sleep(10)

              # Recheck every candidate immediately before submission: a matching
              # page may have changed while another page was pending.
              checked = sorted(paths)
              with ThreadPoolExecutor(max_workers=6) as pool:
                  results = list(pool.map(published, checked))
              paths = {p for p, ready in zip(checked, results) if ready}
              skipped = set(checked) - paths
              if skipped:
                  print("::warning::Not submitted because live content differs or is unavailable: " + ", ".join(sorted(skipped)))
              if not paths:
                  print("No verified live URLs; nothing submitted.")
                  return

              key = Path("6fc78e52c02958b2a79f85c10697ee37.txt").read_text(encoding="utf-8").strip()
              key_location = BASE + key + ".txt"
              with urlopen(key_location, timeout=10) as response:
                  if response.read().decode("utf-8").strip() != key:
                      raise SystemExit("Live IndexNow verification file does not match; no URLs submitted.")
              payload = {"host": HOST, "key": key, "keyLocation": key_location,
                         "urlList": sorted(url_for(path) for path in paths)}
              request = Request("https://api.indexnow.org/indexnow", data=json.dumps(payload).encode("utf-8"),
                                headers={"Content-Type": "application/json; charset=utf-8"}, method="POST")
              with urlopen(request, timeout=30) as response:
                  print("IndexNow response: HTTP", response.status, "URLs sent:", len(paths))
                  if response.status not in (200, 202):
                      raise SystemExit("Unexpected IndexNow response")

          if __name__ == "__main__":
              main()
          PY
